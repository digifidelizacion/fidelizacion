<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de conexión</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f0f5;
    }
    .caja {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h2>Prueba de conexión</h2>
    <p id="resultado">Conectando...</p>
  </div>

  <script>
    async function probar() {
      const resultado = document.getElementById("resultado");
      const { data, error } = await db.from("negocio").select("*").single();

      if (error) {
        resultado.textContent = "❌ Error: " + error.message;
        return;
      }

      resultado.innerHTML =
        "✅ Conectado<br><br>" +
        "<b>Local:</b> " + data.nombre + "<br>" +
        "<b>Sellos para premio:</b> " + data.sellos_meta + "<br>" +
        "<b>Premio:</b> " + data.premio;
    }

    probar();
  </script>
</body>
</html>
